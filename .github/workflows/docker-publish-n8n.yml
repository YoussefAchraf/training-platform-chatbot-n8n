name: Publish n8n image to GHCR

# Based directly on training-platform-backend/-frontend's own
# docker-build-and-scan.yml pattern (build without pushing, Trivy-scan
# that build, only push once the scan passes) - kept as one self-contained
# workflow here rather than their reusable-workflow-call split, since this
# repo only has the one trigger case (push to main) that split exists to
# serve over there.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "bootstrap.js"
      - "*.n8n.json"
      - ".github/workflows/docker-publish-n8n.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: local/training-platform-chatbot-n8n:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        # CRITICAL only, unlike backend/frontend's CRITICAL,HIGH gate on
        # their own first-party images - this Dockerfile only adds 4 small
        # files on top of an unmodified n8nio/n8n base, so HIGH findings
        # here are inherited from n8n's own dependency tree (confirmed:
        # first real run found 18, all HIGH/none CRITICAL, all in n8n's
        # bundled node_modules, none touched by this repo). Gating on HIGH
        # would fail this workflow permanently on things only an n8n
        # release, not this repo, can fix.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/training-platform-chatbot-n8n:scan
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
