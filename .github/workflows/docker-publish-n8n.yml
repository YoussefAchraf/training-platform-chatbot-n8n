name: Publish n8n image to GHCR

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "bootstrap.js"
      - "*.n8n.json"
      - ".github/workflows/docker-publish-n8n.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: local/training-platform-chatbot-n8n:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/training-platform-chatbot-n8n:scan
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout training-platform-gitops
        uses: actions/checkout@v7
        with:
          repository: YoussefAchraf/training-platform-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          ref: dev
          path: gitops-bump

      - name: Bump n8n image tag in training-platform-gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
        working-directory: gitops-bump
        run: |
          set -e
          TAG="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          sed -i '/^n8n:/,/^redis:/ s/tag: "sha-[a-f0-9]*"/tag: "'"$TAG"'"/' environments/local-okd/chatbot-values.yaml
          if git diff --quiet; then
            echo "Already at $TAG, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/bump-n8n-image-$TAG"
          git checkout -b "$BRANCH"
          git add environments/local-okd/chatbot-values.yaml
          git commit -m "Bump n8n image tag to $TAG

          Auto-opened after training-platform-chatbot-n8n's own CI pushed a
          new n8n image. Source: youssefachraf/training-platform-chatbot-n8n@${{ github.sha }}"
          git push origin "$BRANCH"
          gh pr create --repo YoussefAchraf/training-platform-gitops --base dev --head "$BRANCH" \
            --title "Bump n8n image tag to $TAG" \
            --body "Auto-opened after training-platform-chatbot-n8n's CI pushed ghcr.io/youssefachraf/training-platform-chatbot-n8n:$TAG. Auto-merges once dev's required checks pass. Source: youssefachraf/training-platform-chatbot-n8n@${{ github.sha }}"
          gh pr merge --repo YoussefAchraf/training-platform-gitops "$BRANCH" --auto --merge
