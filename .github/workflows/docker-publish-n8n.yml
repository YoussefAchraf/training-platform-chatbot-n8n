name: Publish n8n image to GHCR

# Based directly on training-platform-backend/-frontend's own
# docker-build-and-scan.yml pattern (build without pushing, Trivy-scan
# that build, only push once the scan passes) - kept as one self-contained
# workflow here rather than their reusable-workflow-call split, since this
# repo only has the one trigger case (push to main) that split exists to
# serve over there.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "bootstrap.js"
      - "*.n8n.json"
      - ".github/workflows/docker-publish-n8n.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: local/training-platform-chatbot-n8n:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        # CRITICAL only, unlike backend/frontend's CRITICAL,HIGH gate on
        # their own first-party images - this Dockerfile only adds 4 small
        # files on top of an unmodified n8nio/n8n base, so HIGH findings
        # here are inherited from n8n's own dependency tree (confirmed:
        # first real run found 18, all HIGH/none CRITICAL, all in n8n's
        # bundled node_modules, none touched by this repo). Gating on HIGH
        # would fail this workflow permanently on things only an n8n
        # release, not this repo, can fix.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/training-platform-chatbot-n8n:scan
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Closes the loop training-platform-gitops's own values files can't
      # close on their own: image tags there are deliberately pinned
      # (never `latest`), so without this, a new image published here just
      # sits in GHCR until someone manually bumps the tag over there.
      # Opens a PR bumping environments/local-okd/chatbot-values.yaml's
      # n8n.image.tag - only into gitops's `dev`, never main; promoting dev
      # to what's actually live stays that repo's own deliberate manual
      # step, unchanged. This workflow already only fires on the real
      # push-to-main publish path (see the path-filtered trigger above),
      # so no extra guard is needed here.
      - name: Checkout training-platform-gitops
        uses: actions/checkout@v7
        with:
          repository: YoussefAchraf/training-platform-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          ref: dev
          path: gitops-bump

      - name: Bump n8n image tag in training-platform-gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
        working-directory: gitops-bump
        run: |
          set -e
          TAG="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          sed -i '/^n8n:/,/^redis:/ s/tag: "sha-[a-f0-9]*"/tag: "'"$TAG"'"/' environments/local-okd/chatbot-values.yaml
          if git diff --quiet; then
            echo "Already at $TAG, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/bump-n8n-image-$TAG"
          git checkout -b "$BRANCH"
          git add environments/local-okd/chatbot-values.yaml
          git commit -m "Bump n8n image tag to $TAG

          Auto-opened after training-platform-chatbot-n8n's own CI pushed a
          new n8n image. Source: youssefachraf/training-platform-chatbot-n8n@${{ github.sha }}"
          git push origin "$BRANCH"
          gh pr create --repo YoussefAchraf/training-platform-gitops --base dev --head "$BRANCH" \
            --title "Bump n8n image tag to $TAG" \
            --body "Auto-opened after training-platform-chatbot-n8n's CI pushed ghcr.io/youssefachraf/training-platform-chatbot-n8n:$TAG. Auto-merges once dev's required checks pass. Source: youssefachraf/training-platform-chatbot-n8n@${{ github.sha }}"
          gh pr merge --repo YoussefAchraf/training-platform-gitops "$BRANCH" --auto --merge
