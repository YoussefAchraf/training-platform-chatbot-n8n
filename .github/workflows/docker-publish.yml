name: Publish metrics-exporter to GHCR

on:
  push:
    branches: [main]
    paths:
      - "metrics-exporter/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/training-platform-chatbot-n8n-metrics-exporter

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./metrics-exporter
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Checkout training-platform-gitops
        uses: actions/checkout@v7
        with:
          repository: YoussefAchraf/training-platform-gitops
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          ref: dev
          path: gitops-bump

      - name: Bump metrics-exporter image tag in training-platform-gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
        working-directory: gitops-bump
        run: |
          set -e
          TAG="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          sed -i '/^metricsExporter:/,/^vault:/ s/tag: "sha-[a-f0-9]*"/tag: "'"$TAG"'"/' environments/local-okd/chatbot-values.yaml
          if git diff --quiet; then
            echo "Already at $TAG, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/bump-metrics-exporter-image-$TAG"
          git checkout -b "$BRANCH"
          git add environments/local-okd/chatbot-values.yaml
          git commit -m "Bump metrics-exporter image tag to $TAG

          Auto-opened after training-platform-chatbot-n8n's own CI pushed a
          new metrics-exporter image. Source: youssefachraf/training-platform-chatbot-n8n@${{ github.sha }}"
          git push origin "$BRANCH"
          gh pr create --repo YoussefAchraf/training-platform-gitops --base dev --head "$BRANCH" \
            --title "Bump metrics-exporter image tag to $TAG" \
            --body "Auto-opened after training-platform-chatbot-n8n's CI pushed ghcr.io/youssefachraf/training-platform-chatbot-n8n-metrics-exporter:$TAG. Auto-merges once dev's required checks pass. Source: youssefachraf/training-platform-chatbot-n8n@${{ github.sha }}"
          gh pr merge --repo YoussefAchraf/training-platform-gitops "$BRANCH" --auto --merge
