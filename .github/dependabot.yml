version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/metrics-exporter"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/metrics-exporter"
    schedule:
      interval: "weekly"

  # No root-level entry: dependabot's docker ecosystem only reads an
  # actual Dockerfile (or k8s YAML), not docker-compose.yml's `image:`
  # references - confirmed by a failed update job pointing at "/" with
  # "No Dockerfiles nor Kubernetes YAML found in /". redis/n8n image
  # bumps in docker-compose.yml aren't something Dependabot can track here.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
